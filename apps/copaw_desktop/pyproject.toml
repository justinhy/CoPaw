[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "copaw-desktop"
version = "0.1.0"
description = "Cross-platform AI Voice Companion Desktop Application for CoPaw"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [
    {name = "AgentScope Team", email = "agentscope@alibaba-inc.com"}
]
keywords = ["ai", "voice-assistant", "desktop", "copaw", "pyqt6"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "PyQt6>=6.6.0",
    "PyAudio>=0.2.14",
    "websockets>=12.0",
    "SQLAlchemy>=2.0.0",
    "dashscope>=1.14.0",
    "edge-tts>=6.1.0",
    "aiofiles>=23.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-qt>=4.2.0",
    "pytest-cov>=4.1.0",
    "black>=23.0.0",
    "flake8>=6.1.0",
    "mypy>=1.5.0",
    "tox>=4.11.0",
]
torch = [
    "torch>=2.0.0",
    "torchaudio>=2.0.0",
]
packaging = [
    "pyinstaller>=6.0.0",
]

[project.scripts]
copaw-desktop = "copaw_desktop.main:main"

[project.urls]
Homepage = "https://github.com/agentscope-ai/CoPaw"
Documentation = "https://copaw.agentscope.io"
Repository = "https://github.com/agentscope-ai/CoPaw"
Issues = "https://github.com/agentscope-ai/CoPaw/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100
target-version = ['py310', 'py311', 'py312', 'py313']
include = '\.pyi?$'
extend-exclude = '''
/(
    \.git
  | \.venv
  | venv
  | build
  | dist
  | __pycache__
)/
'''

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
show_error_context = true

[[tool.mypy.overrides]]
module = [
    "PyQt6.*",
    "pyaudio",
    "dashscope.*",
    "edge_tts",
]
ignore_missing_imports = true

[tool.coverage.run]
source = ["src/copaw_desktop"]
omit = [
    "*/tests/*",
    "*/__pycache__/*",
    "*/venv/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
